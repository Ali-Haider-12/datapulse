services:
  # Backend API
  - type: web
    name: datapulse-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && ES_URL=http://localhost:9201 MCP_SERVER_URL=http://localhost:8080/mcp uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false
    plan: free

  # Mock ES + Backend combined (since Render free tier = 1 service)
  # We'll use the backend as a single service that also runs mock ES
  - type: web
    name: datapulse-api
    runtime: python
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: |
      cd backend && python scripts/mock_es_server.py --port 9201 &
      sleep 2
      ES_URL=http://localhost:9201 MCP_SERVER_URL=http://localhost:8080/mcp uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false
    plan: free
